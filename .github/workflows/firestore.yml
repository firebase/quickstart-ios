name: Firestore

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/firestore.yml'
      - 'firestore/**'
      - 'scripts/*'
      - 'scripts/firestore.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/firestore.yml'
      - 'firestore/**'
      - 'scripts/*'
      - 'scripts/firestore.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Firestore
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    runs-on: macos-26
    env:
      SPM: true
      OS: iOS
      DIR: firestore
      DEVICE: iPhone 17 Pro
      TEST: false
      SCHEME: FirestoreExample
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Setup
        run: |
          cd firestore
          gem install xcpretty
          ../scripts/install_prereqs/firestore.sh
      - name: Build
        run: ./scripts/test.sh
