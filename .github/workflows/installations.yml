name: Installations

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/installations.yml'
      - 'installations/**'
      - 'scripts/*'
      - 'scripts/installations.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/installations.yml'
      - 'installations/**'
      - 'scripts/*'
      - 'scripts/installations.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Installations
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - iOS)
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.xcode == '27.1' }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
    env:
      SPM: true
      OS: iOS
      TEST: true
      DIR: installations
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: iOS
      - name: Setup
        run: |
          cd installations
          gem install xcpretty
          ../scripts/install_prereqs/installations.sh
      - name: Build ObjC
        run: ./scripts/test.sh
        env:
          SCHEME: InstallationsExample
