name: Authentication

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/authentication.yml'
      - 'authentication/**'
      - 'scripts/*'
      - 'scripts/authentication.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/authentication.yml'
      - 'authentication/**'
      - 'scripts/*'
      - 'scripts/authentication.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Authentication
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - iOS)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
    env:
      OS: iOS
      SETUP: authentication
      SPM: true
      DIR: authentication
      TEST: false
      SCHEME: AuthenticationExample
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: iOS
      - name: Setup
        run: |
          gem install xcpretty
          cd $SETUP
          ../scripts/install_prereqs/${SETUP}.sh
      - name: Build and Test SwiftUI (${OS})
        run: ./scripts/test.sh
