name: Storage

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/storage.yml'
      - 'storage/**'
      - 'scripts/*'
      - 'scripts/storage.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/storage.yml'
      - 'storage/**'
      - 'scripts/*'
      - 'scripts/storage.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Storage
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        os: [iOS, tvOS, macOS]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
    env:
      SETUP: storage
      SPM: true
      DIR: storage
      OS: ${{ matrix.os }}
      TEST: false
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: ${{ matrix.os }}
      - name: Setup
        run: |
          gem install xcpretty
          cd $SETUP
          ../scripts/install_prereqs/${SETUP}.sh
      - name: Build and Test SwiftUI (${{ matrix.os }})
        run: ./scripts/test.sh
