name: A/B Testing

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/abtesting.yml'
      - 'abtesting/**'
      - 'scripts/*'
      - 'scripts/abtesting.sh'
      - '!abtesting/*.md'
      - '!abtesting/Design/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/abtesting.yml'
      - 'abtesting/**'
      - 'scripts/*'
      - 'scripts/abtesting.sh'
      - '!abtesting/*.md'
      - '!abtesting/Design/**'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}
  SAMPLE: ABTesting

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        os: [iOS, tvOS, macOS, watchOS, catalyst]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
          - os: iOS
            # Test runs locally but fails in CI with:
            # (Underlying Error: lstat of
            # /Users/runner/Library/Developer/CoreSimulator/Devices/
            # 7E72AD09-C998-432D-84B1-0504177194AE/data/Library/Caches/
            # com.apple.mobile.installd.staging/temp.WdeFLV/extracted/ABTestingExample.app
            # /Frameworks/GoogleAppMeasurement.framework/GoogleAppMeasurement failed: No such file or directory
            test: false
          - os: tvOS
            test: true
          - os: macOS
            test: true
          - os: watchOS
            test: false
          - os: catalyst
            test: false # disabled due to a permissions error on launch (OSStatus -54).
    env:
      SETUP: abtesting
      SPM: true
      DIR: abtesting
      OS: ${{ matrix.os }}
      TEST: ${{ matrix.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: ${{ matrix.os }}
      - name: Setup
        run: |
          gem install xcpretty
          cd $SETUP
          ../scripts/install_prereqs/${SETUP}.sh
      - name: Build and Test SwiftUI (${{ matrix.os }})
        run: ./scripts/test.sh
