name: Firestore

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/firestore.yml'
      - 'firestore/**'
      - 'scripts/*'
      - 'scripts/firestore.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/firestore.yml'
      - 'firestore/**'
      - 'scripts/*'
      - 'scripts/firestore.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Firestore
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - iOS)
    runs-on: ${{ matrix.runner }}
    # TODO: Remove 26.2 from continue-on-error once firebase-ios-sdk 13.2.0 is released
    # with the Xcode 26.2 package traits workaround (firebase/firebase-ios-sdk#16944).
    continue-on-error: ${{ matrix.xcode == '26.2' }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
    env:
      SPM: true
      OS: iOS
      DIR: firestore
      TEST: false
      SCHEME: FirestoreExample
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: iOS
      - name: Setup
        run: |
          cd firestore
          gem install xcpretty
          ../scripts/install_prereqs/firestore.sh
      - name: Build
        run: ./scripts/test.sh
