name: Analytics

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/analytics.yml'
      - 'analytics/**'
      - 'scripts/*'
      - 'scripts/analytics.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/analytics.yml'
      - 'analytics/**'
      - 'scripts/*'
      - 'scripts/analytics.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Analytics
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.xcode == '27.1' }}
    strategy:
      fail-fast: false
      matrix:
        # TODO: Re-enable when ODM2 catalyst support is investigated
        # os: [iOS, catalyst, tvOS, macOS]
        os: [iOS, tvOS, macOS]
        xcode: ["26.2", "26.4", "27.1"]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
          - os: iOS
            test: true
          # TODO: Re-enable when ODM2 catalyst support is investigated
          # - os: catalyst
          #   test: false # disabled due to a permissions error on launch (OSStatus -54).
          - os: tvOS
            scheme: AnalyticsExampleTV
            test: true
          - os: macOS
            scheme: AnalyticsExampleMac
            test: true

    env:
      SPM: true
      OS: ${{ matrix.os }}
      SCHEME: ${{ matrix.scheme || 'AnalyticsExample' }}
      DIR: analytics
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: ${{ matrix.os }}
      - name: Setup
        run: |
          cd analytics
          gem install xcpretty
          ../scripts/install_prereqs/analytics.sh
      - name: Build Swift
        run: ./scripts/test.sh
        env:
          TEST: ${{ matrix.test }}
