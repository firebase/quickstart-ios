name: Crashlytics

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/crashlytics.yml'
      - 'crashlytics/**'
      - 'scripts/*'
      - 'scripts/crashlytics.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/crashlytics.yml'
      - 'crashlytics/**'
      - 'scripts/*'
      - 'scripts/crashlytics.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Crashlytics
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm:
    name: spm (Xcode ${{ matrix.xcode }} - ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4"]
        os: [iOS, tvOS, macOS, watchOS]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - os: iOS
            test: false # flaky
          - os: tvOS
            test: true
          - os: macOS
            test: true
          - os: watchOS
            test: false
    env:
      SETUP: crashlytics
      SPM: true
      DIR: crashlytics
      OS: ${{ matrix.os }}
      TEST: ${{ matrix.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: ./.github/actions/setup_simulator
        with:
          platform: ${{ matrix.os }}
      - name: Setup
        run: |
          gem install xcpretty
          cd $SETUP
          ../scripts/install_prereqs/${SETUP}.sh
      - name: Build and Test SwiftUI (${{ matrix.os }})
        run: ./scripts/test.sh
