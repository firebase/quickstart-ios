name: Performance

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/performance.yml'
      - 'performance/**'
      - 'scripts/*'
      - 'scripts/performance.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/performance.yml'
      - 'performance/**'
      - 'scripts/*'
      - 'scripts/performance.sh'

  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
  SAMPLE: Performance
  secrets_passphrase: ${{ secrets.GHASECRETSGPGPASSPHRASE1 }}

jobs:
  spm-buildonly:
    name: spm (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
    env:
      SPM: true
      OS: iOS
      TEST: false
      DIR: performance
      SCHEME: PerformanceExample (iOS)
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: firebase/firebase-ios-sdk/.github/actions/setup_simulator@e1e760d7ab3a985cd590f284ad632afc7d192924 # main
        with:
          platform: iOS
      - name: Setup
        run: |
          cd performance
          gem install xcpretty
          ../scripts/install_prereqs/performance.sh
      - name: Build Swift
        run: ./scripts/test.sh

  spm:
    name: spm (Xcode ${{ matrix.xcode }} - ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.4", "27.1"]
        os: [iOS, tvOS]
        include:
          - xcode: "26.2"
            runner: macos-15
          - xcode: "26.4"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
          - os: iOS
            test: false
            scheme: PerformanceExample (iOS)
          - os: tvOS
            test: false
            scheme: PerformanceExample (tvOS)
    env:
      SETUP: performance
      SPM: true
      DIR: performance
      OS: ${{ matrix.os }}
      TEST: ${{ matrix.test }}
      SCHEME: ${{ matrix.scheme }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Setup simulator
        uses: firebase/firebase-ios-sdk/.github/actions/setup_simulator@e1e760d7ab3a985cd590f284ad632afc7d192924 # main
        with:
          platform: ${{ matrix.os }}
      - name: Setup
        run: |
          gem install xcpretty
          cd $SETUP
          ../scripts/install_prereqs/${SETUP}.sh
      - name: Build and Test SwiftUI (${{ matrix.os }})
        run: ./scripts/test.sh
